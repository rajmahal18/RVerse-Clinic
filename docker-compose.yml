services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-system-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_password
      POSTGRES_DB: clinic_system
    ports:
      - "5433:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_system"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  clinic_postgres_data:
